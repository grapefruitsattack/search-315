<svg id="ogp" viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
			<defs id="defs">
				<!-- ===== Background gradient ===== -->
				<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
					<stop id="bg-stop-1" offset="0%" stop-color="rgba(10,61,127,1)"/>
					<stop id="bg-stop-2" offset="100%" stop-color="rgba(173,255,245,1)"/>
				</linearGradient>

				<!-- ===== Card shadow filter ===== -->
				<filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
					<!-- 影色は黒の薄め。opacityは cardAlpha と別管理 -->
					<feDropShadow id="shadow" dx="0" dy="8" stdDeviation="12" flood-color="rgba(37,99,235,0.2)"/>
				</filter>

				<!-- ===== Pattern ===== -->
				<pattern id="patTile" patternUnits="userSpaceOnUse" width="200" height="252" patternTransform="rotate(-18 100 126)"/>

				<!-- ===== Badge Clip ===== -->
				<clipPath id="badge-clip-rounded">
					<rect id="badge-clip-rounded-rect" x="0" y="0" width="1" height="1" rx="12" ry="12"/>
				</clipPath>

				<clipPath id="badge-clip-circle">
					<circle id="badge-clip-circle-c" cx="0" cy="0" r="1"/>
				</clipPath>
			</defs>

			<rect id="bg" x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
			<g id="pattern"/>

			<g id="card">
				<rect id="card-rect" x="64" y="64" width="1072" height="502" rx="36" ry="36" fill="rgba(255,255,255,0.92)" filter="url(#cardShadow)"/>
			</g>

			<g id="text-group">
				<g id="badge-group" style="display: block;">
					<rect id="badge-bg" fill="rgba(255,255,255,0)" stroke="rgba(37,99,235,0.28)" stroke-width="2" style="display: block;" x="534.00146484375" y="-62.29981994628906" width="131.99707794189453" height="52.02368927001953" rx="30" ry="30"/>
					<image id="badge-icon" style="display: none;"/>
					<text id="badge-text" text-anchor="middle" dominant-baseline="auto" x="600" y="-24" fill="rgba(37,99,235,1)" font-size="28" font-weight="700" font-family="&quot;Noto Sans JP&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" style="display: block;">ツール</text>
				</g>

				<g id="title-group">
					<text id="title-text" text-anchor="middle" dominant-baseline="middle" x="600" y="315" fill="rgba(37,99,235,1)" font-size="76" font-weight="900" font-family="&quot;Noto Sans JP&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif"/>
				</g>

				<g id="subtitle-group" style="display: none;">
					<line id="divider" x1="340" x2="860" y1="24" y2="24" stroke="rgba(107,114,128,0.5)" stroke-width="2" stroke-linecap="round"/>
					<text id="subtitle-text" text-anchor="middle" dominant-baseline="hanging" x="600" y="48" fill="rgba(107,114,128,1)" font-size="34" font-weight="700" font-family="&quot;Noto Sans JP&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">おてがるSNSシェア画像作成</text>
				</g>
			</g>
		</svg>